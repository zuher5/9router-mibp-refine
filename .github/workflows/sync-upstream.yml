name: Sync upstream

# Menjaga fork ini tetap mengikuti base fork: mhiqrambg/9router-mibp-version
#
#   Job "mirror" : branch `upstream-mirror` = SALINAN PERSIS upstream.
#                  Selalu fast-forward, jadi TIDAK MUNGKIN konflik.
#                  Ini jaminan "update upstream selalu masuk ke fork".
#   Job "merge"  : merge `upstream-mirror` -> `master` (branch kerja kamu).
#                  Kalau konflik: TIDAK force-push, job gagal, dibuat issue untuk resolve manual.
#
# Rantai fork: decolua/9router -> mhiqrambg/9router-mibp-version -> zuher5/9router-mibp-refine
# Workflow ini hanya mengikuti base fork (mhiqrambg). Update dari decolua akan sampai
# setelah mhiqrambg men-sync fork mereka.

on:
  schedule:
    - cron: "17 3 * * *" # harian 03:17 UTC = 10:17 WIB
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'zuher5/9router-mibp-refine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Mirror upstream -> upstream-mirror
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/mhiqrambg/9router-mibp-version.git
          git fetch upstream master --tags
          UP=$(git rev-parse upstream/master)
          echo "upstream/master = $UP"
          git push origin "$UP:refs/heads/upstream-mirror"
          echo "upstream-mirror sekarang di $UP"

  merge:
    needs: mirror
    if: github.repository == 'zuher5/9router-mibp-refine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: master

      - name: Merge upstream-mirror -> master
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master upstream-mirror

          if git merge-base --is-ancestor origin/upstream-mirror HEAD; then
            echo "master sudah memuat seluruh upstream. Tidak ada yang perlu dilakukan."
            exit 0
          fi

          echo "=== commit upstream yang akan masuk ==="
          git log --oneline --no-decorate HEAD..origin/upstream-mirror | head -50
          echo "=== file yang berubah ==="
          git diff --stat HEAD origin/upstream-mirror | tail -40

          git merge --no-ff origin/upstream-mirror \
            -m "chore(sync): merge upstream $(git rev-parse --short origin/upstream-mirror)"
          git push origin HEAD:master
          echo "master berhasil di-merge dan di-push."

      - name: Buat / update issue kalau konflik
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            Auto-sync upstream **gagal karena konflik merge**. Tidak ada yang di-push — `master` tetap aman dan tidak disentuh.

            Resolve manual di lokal:

            ```powershell
            cd C:\Users\Zuher\projects\9router-mibp-refine
            git fetch origin --prune
            git merge origin/upstream-mirror
            # selesaikan konflik, lalu:
            git add -A
            git commit
            git push origin master
            ```

            Setelah di-push, jalankan workflow ini lagi:
            **Actions -> Sync upstream -> Run workflow**.
        run: |
          set -uo pipefail
          git merge --abort || true
          gh label create upstream-sync --color FBCA04 --description "Konflik sync dari base fork" 2>/dev/null || true
          N=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$BODY"
          else
            gh issue create --title "Upstream sync konflik (perlu resolve manual)" --body "$BODY" --label upstream-sync
          fi
